<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Van Spots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-height map with a 400px working panel on the left; on phones the panel becomes the lower half. */
:root{
  --bg:#EAEFEC; --panel:#F8FAF9; --raised:#FFFFFF; --line:#D3DCD8; --fg:#16211F; --muted:#5A6A66;
  --accent:#0E6B5B; --accent-fg:#FFFFFF; --best:#B86E00; --danger:#B3382C; --ring:#FFFFFF; --shadow:rgba(20,35,30,.18);
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-data:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1311; --panel:#141C1A; --raised:#1B2623; --line:#2A3834; --fg:#E5EDEA; --muted:#8CA09A;
    --accent:#3FBF9F; --accent-fg:#06201A; --best:#F0A53A; --danger:#FF7D6E; --ring:#0D1311; --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1311; --panel:#141C1A; --raised:#1B2623; --line:#2A3834; --fg:#E5EDEA; --muted:#8CA09A;
  --accent:#3FBF9F; --accent-fg:#06201A; --best:#F0A53A; --danger:#FF7D6E; --ring:#0D1311; --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-body);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:400px minmax(0,1fr);height:100%}
.panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.mapwrap{position:relative;min-width:0;min-height:0;background:var(--bg)}
#map{position:absolute;inset:0}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,46%) minmax(0,54%)}
  .mapwrap{order:-1}
  .panel{border-right:0;border-top:1px solid var(--line)}
}
/* header + tabs */
.head{padding:14px 16px 0;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.head h1{font:700 21px/1.1 var(--font-display);margin:0;letter-spacing:-.01em}
.head .sub{color:var(--muted);font-size:12px;font-family:var(--font-data)}
.tabs{display:flex;gap:2px;padding:10px 12px 0;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;color:var(--muted);font-weight:600}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.body{flex:1;min-height:0;overflow:auto;padding:14px 16px 24px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.grow>*{flex:1;min-width:0}
h2{font:600 12px/1 var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 0 0}
h3{font:700 16px/1.2 var(--font-display);margin:0}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.small{font-size:12px}
/* controls */
.btn{border:1px solid var(--line);background:var(--raised);border-radius:6px;padding:7px 11px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.btn.danger[data-armed="1"]{background:var(--danger);color:var(--panel);border-color:var(--danger)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}
input[type=text],input[type=number],input[type=search],input[type=date],input[type=datetime-local],select,textarea{
  width:100%;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
textarea{resize:vertical;min-height:84px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.pill{font:500 11px var(--font-data);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
.pill.ok{color:var(--accent);border-color:var(--accent)}
.pill.warn{color:var(--best);border-color:var(--best)}
.pill.bad{color:var(--danger);border-color:var(--danger)}
/* cards + lists */
.card{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
.card.click{cursor:pointer;display:block;width:100%;text-align:left}
.card.click:hover{border-color:var(--accent)}
.card .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .t b{font:700 15px/1.25 var(--font-display)}
.star{color:var(--best)}
.empty{border:1px dashed var(--line);border-radius:8px;padding:18px 16px;display:flex;flex-direction:column;gap:8px}
.empty b{font:700 16px var(--font-display)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-weight:600;text-align:left;color:var(--muted);padding:4px 6px 4px 0}
td{padding:5px 6px 5px 0;border-top:1px solid var(--line)}
.scroll-x{overflow-x:auto}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:7px 4px;border-top:1px solid var(--line);cursor:pointer}
.srow:hover{background:var(--raised)}
.srow .l{min-width:0}
.srow .l div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow.off{opacity:.5}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ring);box-shadow:0 0 0 1px var(--line)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.photos button{padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;aspect-ratio:1;background:var(--raised)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.gbox{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--raised);display:flex;flex-direction:column;gap:6px}
.gbox .src{font-size:11px;color:var(--muted)}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-weight:600;z-index:5;max-width:90%}
.banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-fg);padding:8px 14px;border-radius:6px;font-weight:600;z-index:5;box-shadow:0 4px 14px var(--shadow)}
.mapbtns{position:absolute;top:10px;right:10px;z-index:4;display:flex;gap:6px}
.setup{position:absolute;inset:0;display:grid;place-items:center;padding:20px;z-index:6;background:var(--bg)}
.setup .card{max-width:440px;display:flex;flex-direction:column;gap:12px;padding:20px}
.setup ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.setup code,.small code{font-family:var(--font-data);font-size:12px;background:var(--bg);padding:1px 4px;border-radius:3px}
.err{color:var(--danger);font-weight:600}
/* map markers */
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ring);box-shadow:0 0 0 1px rgba(0,0,0,.25);transform:translateY(50%)}
.pin{width:30px;height:38px;position:relative;filter:drop-shadow(0 2px 3px var(--shadow))}
.pin svg{width:100%;height:100%;display:block}
.pin .g{fill:var(--accent)}
.pin.best .g{fill:var(--best)}
.pin.sel{transform:scale(1.2);transform-origin:bottom center}
.pin span{position:absolute;top:6px;left:0;right:0;text-align:center;color:#fff;font-size:12px;line-height:16px}
.iw{font:13px/1.4 var(--font-body);color:#16211F;min-width:190px}
.iw b{font-family:var(--font-display);font-size:14px}
.iw .btn{margin-top:6px;margin-right:4px;color:#16211F;background:#fff}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:grid;place-items:center;padding:20px}
.lb img{max-width:100%;max-height:calc(100% - 40px);border-radius:6px}
.lb .cap{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#ddd;font-size:12px}
.lb button{position:absolute;top:12px;right:12px}
@media (prefers-reduced-motion:no-preference){.card.click{transition:border-color .15s}}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="head"><h1>Van Spots</h1><span class="sub" id="counts"></span></div>
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="spots">Spots</button>
      <button class="tab" role="tab" data-tab="speed">Speedtests</button>
      <button class="tab" role="tab" data-tab="data">Data</button>
    </div>
    <div class="body" id="body"></div>
  </aside>
  <main class="mapwrap">
    <div id="map"></div>
    <div class="mapbtns" id="mapbtns"></div>
    <div id="mapmsg"></div>
  </main>
</div>
<div id="lb" hidden></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, e = document) => e.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmt = (n, d = 0) => (n == null || isNaN(n)) ? "–" : Number(n).toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: d });
const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? "–" : d.toLocaleString(undefined, { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }); };
const hav = (a, b, c, d) => { const R = 6371000, r = Math.PI / 180, dp = (c - a) * r, dl = (d - b) * r; const x = Math.sin(dp / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(dl / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); };
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const SPEED_CLASSES = [[10, "#440154", "<10"], [50, "#3b528b", "10–50"], [150, "#21908d", "50–150"], [500, "#5dc863", "150–500"], [Infinity, "#fde725", "500+"]];
const speedColor = d => (SPEED_CLASSES.find(c => d < c[0]) || SPEED_CLASSES[4])[1];
const callGrade = (down, up) => down >= 100 && up >= 20 ? ["Fast", "ok"] : down >= 25 && up >= 5 ? ["Workable", "warn"] : ["Slow", "bad"];

/* ---------- local private storage (IndexedDB, stays in this browser) ---------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("camper-spot-atlas", 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore("spots", { keyPath: "id" });
        d.createObjectStore("wifi", { keyPath: "id" });
        d.createObjectStore("speed", { keyPath: "id" });
        d.createObjectStore("kv", { keyPath: "k" });
        d.createObjectStore("photos", { keyPath: "id" }).createIndex("spotId", "spotId");
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode), s = t.objectStore(store);
      const q = fn(s);
      t.oncomplete = () => res(q && q.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  },
  all: function (s) { return this.tx(s, "readonly", st => st.getAll()); },
  put: function (s, o) { return this.tx(s, "readwrite", st => st.put(o)); },
  putMany: function (s, arr) { return this.tx(s, "readwrite", st => { arr.forEach(o => st.put(o)); }); },
  del: function (s, k) { return this.tx(s, "readwrite", st => st.delete(k)); },
  clear: function (s) { return this.tx(s, "readwrite", st => st.clear()); },
  byIndex: function (s, i, v) { return this.tx(s, "readonly", st => st.index(i).getAll(v)); },
  async delWhere(s, i, v) { const rows = await this.byIndex(s, i, v); await this.tx(s, "readwrite", st => rows.forEach(r => st.delete(r.id))); },
  async getKv(k, dflt) { const r = await this.tx("kv", "readonly", st => st.get(k)); return r ? r.v : dflt; },
  setKv: function (k, v) { return this.put("kv", { k, v }); }
};

/* ---------- state ---------- */
const S = {
  spots: [], wifi: [], speed: [], noLoc: 0, hidden: new Set(),
  f: { off: new Set(), from: "", to: "", minDown: 0, q: "" },
  ui: { tab: "spots", spotId: null, bestOnly: false, sort: "best", results: null, linkResults: null, importRows: null, busy: "" },
  addMode: false, key: lsGet("csa.key") || "", mapReady: false
};
const spotById = id => S.spots.find(s => s.id === id);
const wifiOf = id => S.wifi.filter(w => w.spotId === id).sort((a, b) => b.t.localeCompare(a.t));
function wifiStats(id) {
  const w = wifiOf(id); if (!w.length) return null;
  const avg = k => w.reduce((a, x) => a + (x[k] || 0), 0) / w.length;
  return { n: w.length, down: avg("down"), up: avg("up"), best: Math.max(...w.map(x => x.down || 0)) };
}
const passFilter = r => {
  const f = S.f;
  if (f.off.has(r.type)) return false;
  const day = r.t.slice(0, 10);
  if (f.from && day < f.from) return false;
  if (f.to && day > f.to) return false;
  if (r.down < f.minDown) return false;
  if (f.q && !(r.server || "").toLowerCase().includes(f.q.toLowerCase())) return false;
  return true;
};
const isShown = r => !S.hidden.has(r.id) && passFilter(r);
const savePrefs = () => DB.setKv("prefs", { off: [...S.f.off], from: S.f.from, to: S.f.to, minDown: S.f.minDown, q: S.f.q, bestOnly: S.ui.bestOnly, sort: S.ui.sort });
const saveHidden = () => DB.setKv("hidden", [...S.hidden]);
let toastT;
function toast(msg) {
  let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; $("#mapmsg").appendChild(t); }
  t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3200);
}

/* ---------- Google Maps ---------- */
const G = { map: null, Place: null, iw: null, spotMk: new Map(), speedMk: new Map(), AME: null };
const PLACE_FIELDS = ["id", "displayName", "formattedAddress", "location", "rating", "userRatingCount", "editorialSummary", "types", "googleMapsURI", "websiteURI"];
function loadGoogle() {
  return new Promise((res, rej) => {
    if (window.google && google.maps) return res();
    window.__gmReady = res;
    window.gm_authFailure = () => { showSetup("Google rejected this key. Check that Maps JavaScript API and Places API (New) are enabled and that the key allows this site's address."); };
    const s = document.createElement("script");
    s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(S.key) + "&loading=async&v=weekly&callback=__gmReady";
    s.onerror = () => rej(new Error("Could not load Google Maps. Check your connection and the key."));
    document.head.appendChild(s);
  });
}
async function initMap() {
  if (!S.key) return showSetup();
  try {
    await loadGoogle();
    const { Map } = await google.maps.importLibrary("maps");
    const mk = await google.maps.importLibrary("marker");
    const pl = await google.maps.importLibrary("places");
    G.AME = mk.AdvancedMarkerElement; G.Place = pl.Place;
    G.map = new Map($("#map"), {
      center: { lat: 41.39, lng: 2.16 }, zoom: 6, mapId: "DEMO_MAP_ID", mapTypeControl: true, streetViewControl: false, fullscreenControl: false,
      colorScheme: (google.maps.ColorScheme && google.maps.ColorScheme.FOLLOW_SYSTEM) || "FOLLOW_SYSTEM", clickableIcons: false
    });
    G.iw = new google.maps.InfoWindow();
    G.map.addListener("click", e => { if (S.addMode) { addSpotAt(e.latLng.lat(), e.latLng.lng()); setAddMode(false); } else G.iw.close(); });
    S.mapReady = true; $("#mapmsg").innerHTML = "";
    $("#mapbtns").innerHTML = '<button class="btn" id="b-add">+ Add spot</button><button class="btn" id="b-fit">Fit to view</button>';
    $("#b-add").onclick = () => setAddMode(!S.addMode);
    $("#b-fit").onclick = fitAll;
    syncSpotMarkers(); syncSpeedMarkers(); fitAll();
  } catch (e) { showSetup(e.message); }
}
function showSetup(err) {
  S.mapReady = false;
  $("#mapmsg").innerHTML = `<div class="setup"><div class="card">
    <h3>Connect Google Maps</h3>
    <p class="muted">Paste a Google Maps API key. It is kept in this browser only and is never written into the page.</p>
    <ol class="small"><li>In Google Cloud, enable <b>Maps JavaScript API</b> and <b>Places API (New)</b>.</li>
    <li>Create an API key and restrict it to the address you open this page from.</li></ol>
    ${err ? `<p class="err">${esc(err)}</p>` : ""}
    <input type="text" id="keyin" placeholder="AIza…" value="${esc(S.key)}" autocomplete="off">
    <div class="row"><button class="btn primary" id="keysave">Save and load map</button></div></div></div>`;
  $("#keysave").onclick = () => { S.key = $("#keyin").value.trim(); lsSet("csa.key", S.key); if (!S.key) return; location.reload(); };
}
function setAddMode(on) {
  S.addMode = on;
  const old = $("#mapmsg .banner"); if (old) old.remove();
  if (on) { const b = document.createElement("div"); b.className = "banner"; b.textContent = "Click the map to place the spot. Esc cancels."; $("#mapmsg").appendChild(b); }
  if (G.map) G.map.setOptions({ draggableCursor: on ? "crosshair" : null });
  const bt = $("#b-add"); if (bt) bt.textContent = on ? "Cancel" : "+ Add spot";
}
function pinEl(s, sel) {
  const d = document.createElement("div");
  d.className = "pin" + (s.best ? " best" : "") + (sel ? " sel" : "");
  d.innerHTML = '<svg viewBox="0 0 30 38"><path class="g" d="M15 1C7.3 1 1 7.2 1 14.9 1 25 15 37 15 37s14-12 14-22.100C29 7.200 22.700 1 15 1z" stroke="#fff" stroke-width="2"/></svg>' + (s.best ? "<span>★</span>" : "");
  return d;
}
function syncSpotMarkers() {
  if (!S.mapReady) return;
  const ids = new Set(S.spots.map(s => s.id));
  for (const [id, m] of G.spotMk) if (!ids.has(id)) { m.map = null; G.spotMk.delete(id); }
  for (const s of S.spots) {
    let m = G.spotMk.get(s.id);
    const pos = { lat: s.lat, lng: s.lng };
    if (!m) {
      m = new G.AME({ map: G.map, position: pos, content: pinEl(s, false), title: s.name, gmpDraggable: false, zIndex: 10 });
      m.addListener("click", () => selectSpot(s.id, true));
      m.addListener("dragend", () => { const p = m.position; const sp = spotById(s.id); sp.lat = p.lat; sp.lng = p.lng; DB.put("spots", sp); if (S.ui.spotId === s.id) renderTab(); });
      G.spotMk.set(s.id, m);
    } else { m.position = pos; m.title = s.name; m.content = pinEl(s, S.ui.spotId === s.id); }
    m.gmpDraggable = S.ui.spotId === s.id;
    m.zIndex = S.ui.spotId === s.id ? 20 : 10;
  }
}
function syncSpeedMarkers() {
  if (!S.mapReady) return;
  for (const r of S.speed) {
    let m = G.speedMk.get(r.id);
    if (!m) {
      const d = document.createElement("div"); d.className = "dot"; d.style.background = speedColor(r.down);
      m = new G.AME({ position: { lat: r.lat, lng: r.lng }, content: d, title: Math.round(r.down) + " Mbps", zIndex: 1 });
      m.addListener("click", () => openSpeedInfo(r));
      G.speedMk.set(r.id, m);
    }
    const want = isShown(r) ? G.map : null;
    if (m.map !== want) m.map = want;
  }
}
function fitAll() {
  if (!S.mapReady) return;
  const pts = S.spots.length ? S.spots.map(s => ({ lat: s.lat, lng: s.lng })) : S.speed.filter(isShown).map(r => ({ lat: r.lat, lng: r.lng }));
  if (!pts.length) return;
  const b = new google.maps.LatLngBounds(); pts.forEach(p => b.extend(p));
  G.map.fitBounds(b, 60); google.maps.event.addListenerOnce(G.map, "idle", () => { if (G.map.getZoom() > 15) G.map.setZoom(15); });
}
function nearestSpot(lat, lng, within = 500) {
  let best = null, bd = within;
  for (const s of S.spots) { const d = hav(lat, lng, s.lat, s.lng); if (d <= bd) { bd = d; best = s; } }
  return best ? { s: best, d: bd } : null;
}
function openSpeedInfo(r) {

  const el = document.createElement("div"); el.className = "iw";
  el.innerHTML = `<b>${fmt(r.down, 1)} ↓ / ${fmt(r.up, 1)} ↑ Mbps</b><div>${esc(fmtDate(r.t))} · ${esc(r.type)}${r.ping != null ? " · " + r.ping + " ms" : ""}</div><div>${esc(r.server || "")}</div>`;
  const add = (label, fn) => { const b = document.createElement("button"); b.className = "btn sm"; b.textContent = label; b.onclick = fn; el.appendChild(b); };
  if (n) add("Log at " + n.s.name, () => logSpeedAtSpot(r, n.s));
  add("New spot here", () => { G.iw.close(); addSpotAt(r.lat, r.lng); });

let photoUrls = [], photoCache = {};
async function resizeBlob(bmp, max, q) {
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, "image/jpeg", q));
}
async function addPhotos(spotId, files) {
  let ok = 0, bad = 0;
  for (const f of files) {
    try {
      const bmp = await createImageBitmap(f);
      const full = await resizeBlob(bmp, 1800, .86), thumb = await resizeBlob(bmp, 360, .8);
      await DB.put("photos", { id: uid(), spotId, full, thumb, added: Date.now(), name: f.name });
      ok++;
    } catch (e) { bad++; }
  }
  toast(ok ? `Added ${ok} photo${ok > 1 ? "s" : ""}` + (bad ? `, ${bad} could not be read` : "") : "Could not read that image. HEIC files often need converting to JPEG first.");
  loadPhotos(spotId);
}
async function loadPhotos(spotId) {

  const rows = (await DB.byIndex("photos", "spotId", spotId)).sort((a, b) => a.added - b.added);

  grid.innerHTML = rows.length ? rows.map(r => { const u = URL.createObjectURL(r.thumb); photoUrls.push(u); photoCache[r.id] = r; return `<button data-act="photo" data-id="${r.id}" aria-label="Open photo"><img src="${u}" alt=""></button>`; }).join("") : '<p class="muted small" style="grid-column:1/-1">No photos yet. They stay in this browser only.</p>';
}
function openLightbox(id) {

    $("#lbx").onclick = close;
    const d = $("#lbdel"); d.onclick = async () => { if (d.dataset.armed !== "1") { d.dataset.armed = "1"; d.textContent = "Tap again to delete"; return; } await DB.del("photos", ids[i]); close(); loadPhotos(S.ui.spotId); };
  };
  const close = () => { lb.hidden = true; lb.innerHTML = ""; if (url) URL.revokeObjectURL(url); document.removeEventListener("keydown", key); };
  const key = e => { if (e.key === "Escape") close(); if (e.key === "ArrowRight") { i = (i + 1) % ids.length; show(); } if (e.key === "ArrowLeft") { i = (i - 1 + ids.length) % ids.length; show(); } };
  lb.hidden = false; document.addEventListener("keydown", key); lb.onclick = e => { if (e.target === lb) close(); }; show();
}

/* ---------- import: Google saved places (GeoJSON from Takeout, KML from My Maps) ---------- */
function parseSaved(name, text) {
  const out = [];
  if (/\.csv$/i.test(name)) throw new Error("Takeout CSV lists have no coordinates. Use the 'Saved Places' GeoJSON file from Google Takeout, or export a My Maps layer as KML.");
  if (/\.(kml)$/i.test(name) || text.trimStart().startsWith("<")) {
    const doc = new DOMParser().parseFromString(text, "text/xml");
    doc.querySelectorAll("Placemark").forEach(p => {
      const c = p.querySelector("Point > coordinates"); if (!c) return;
      const [lng, lat] = c.textContent.trim().split(",").map(Number);
      const nm = (p.querySelector("name") || {}).textContent || "Unnamed";
      const ds = (p.querySelector("description") || {}).textContent || "";
      if (isFinite(lat) && isFinite(lng)) out.push({ name: nm.trim(), lat, lng, note: ds.replace(/<[^>]+>/g, " ").trim().slice(0, 400) });
    });
  } else {
    const j = JSON.parse(text);
    (j.features || []).forEach(f => {
      const pr = f.properties || {}, loc = pr.Location || pr.location || {};
      let lng, lat;
      if (f.geometry && f.geometry.type === "Point") [lng, lat] = f.geometry.coordinates;
      if ((!lat && !lng) || (lat === 0 && lng === 0)) { const g = loc["Geo Coordinates"] || {}; lat = parseFloat(g.Latitude); lng = parseFloat(g.Longitude); }
      if (!isFinite(lat) || !isFinite(lng) || (lat === 0 && lng === 0)) return;
      out.push({ name: pr.Title || pr.title || pr.name || loc["Business Name"] || "Unnamed", lat, lng, note: loc.Address || "" });
    });
  }
  return out.map(r => ({ ...r, key: uid(), dupe: S.spots.some(s => hav(s.lat, s.lng, r.lat, r.lng) < 40 && s.name.toLowerCase() === r.name.toLowerCase()), pick: false }));
}

/* ---------- Speedtest export (CSV) ---------- */
function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
function parseSpeed(text) {
  const rows = parseCSV(text.replace(/^﻿/, "")); const h = rows.shift().map(x => x.trim());
  const ix = p => h.findIndex(x => x.toLowerCase().startsWith(p));
  const I = { d: ix("date"), t: ix("time"), type: ix("connection"), lat: ix("latitude"), lng: ix("longitude"), dl: ix("download speed"), ul: ix("upload speed"), lat_ms: ix("latency"), sv: ix("server") };
  if (I.d < 0 || I.dl < 0) throw new Error("This doesn't look like a Speedtest export (no Date or Download Speed column).");
  const out = [], seen = new Set(); let noLoc = 0;
  for (const r of rows) {
    if (r.length < 5) continue;
    const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec((r[I.d] || "").trim()); if (!m) continue;
    const tm = /^(\d{1,2}):(\d{2})/.exec((r[I.t] || "").trim()) || [0, "0", "00"];
    const t = `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}T${tm[1].padStart(2, "0")}:${tm[2]}`;
    const lat = parseFloat(r[I.lat]), lng = parseFloat(r[I.lng]);
    if (!isFinite(lat) || !isFinite(lng)) { noLoc++; continue; }
    const down = parseFloat(r[I.dl]), up = parseFloat(r[I.ul]), ping = parseInt(r[I.lat_ms], 10);
    let id = t.replace(/\D/g, "") + "-" + Math.round(down * 100) + "-" + (r[I.type] || ""); while (seen.has(id)) id += "x"; seen.add(id);
    out.push({ id, t, type: (r[I.type] || "Unknown").trim(), lat, lng, down: down || 0, up: up || 0, ping: isFinite(ping) ? ping : null, server: (r[I.sv] || "").trim() });
  }
  return { rows: out, noLoc };
}

  return `<div class="stack">
    <h2>Google Maps</h2>
    <div class="card"><p class="small">${S.key ? "A key is saved in this browser." : "No key saved."}</p><div class="row" style="margin-top:8px"><button class="btn sm" data-act="changekey">${S.key ? "Change key" : "Add key"}</button></div></div>
    <h2>Import your saved places</h2>
    <p class="small muted">Use the <code>Saved Places.json</code> from Google Takeout (Saved), or a My Maps layer exported as KML. Then tick only the spots you want.</p>
    <div><label class="btn" for="saved-in">Choose file</label><input type="file" id="saved-in" accept=".json,.geojson,.kml,.csv" hidden></div>
    ${S.ui.busy ? `<p class="err small">${esc(S.ui.busy)}</p>` : ""}
    ${im ? `<div class="card stack"><div class="row" style="justify-content:space-between"><b>${im.length} places found</b><span class="row"><button class="btn sm" data-act="impall">Select all</button><button class="btn sm" data-act="impnone">None</button></span></div>
      <div style="max-height:260px;overflow:auto">${im.map(r => `<label class="srow" style="grid-template-columns:auto minmax(0,1fr)"><input type="checkbox" data-act="imppick" data-k="${r.key}" ${r.pick ? "checked" : ""} ${r.dupe ? "disabled" : ""}><span class="l"><div>${esc(r.name)}</div><div class="muted small">${r.dupe ? "Already in your spots" : esc(r.note)}</div></span></label>`).join("")}</div>
      <label class="row small"><input type="checkbox" id="imp-best"> Mark imported spots as ★ Best</label>
      <div class="row"><button class="btn primary" data-act="impgo">Import selected (${im.filter(r => r.pick).length})</button><button class="btn ghost" data-act="impcancel">Cancel</button></div></div>` : ""}
    <h2>Speedtest export</h2>
    <p class="small muted">${S.speed.length ? `${S.speed.length} results loaded. Loading a newer export adds new tests and keeps your hide/show choices.` : "Choose the CSV exported from the Speedtest app."}</p>
    <div class="row"><label class="btn" for="speed-in">Choose CSV file</label><input type="file" id="speed-in" accept=".csv,text/csv" hidden>${S.speed.length ? '<button class="btn ghost danger" data-act="clearspeed">Remove results</button>' : ""}</div>
    ${S.ui.busy2 ? `<p class="small ${S.ui.busy2.startsWith("Loaded") ? "" : "err"}">${esc(S.ui.busy2)}</p>` : ""}
    <h2>Backup</h2>
    <p class="small muted">Spots, notes and WiFi readings can be exported. Photos are not included yet.</p>
    <div><button class="btn" data-act="export">Download spots and WiFi (JSON)</button></div>
  </div>`;
}

/* ---------- events ---------- */
const body = $("#body");
$("#tabs").addEventListener("click", e => { const t = e.target.closest(".tab"); if (!t) return; S.ui.tab = t.dataset.tab; renderAll(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.addMode) setAddMode(false); });
function armed(btn, label) { if (btn.dataset.armed === "1") return true; btn.dataset.armed = "1"; const o = btn.textContent; btn.textContent = label || "Tap again to confirm"; setTimeout(() => { btn.dataset.armed = ""; btn.textContent = o; }, 3000); return false; }
body.addEventListener("click", async e => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, id = a.dataset.id, s = spotById(S.ui.spotId);
  if (act === "tog") { e.stopPropagation(); if (a.checked) S.hidden.delete(id); else S.hidden.add(id); saveHidden(); syncSpeedMarkers(); renderHead(); a.closest(".srow").classList.toggle("off", !a.checked); return; }
  if (act === "imppick") { const r = S.ui.importRows.find(x => x.key === a.dataset.k); r.pick = a.checked; renderTab(); return; }
  switch (act) {
    case "open": selectSpot(id, true); break;
    case "back": S.ui.spotId = null; syncSpotMarkers(); renderAll(); break;
    case "flyto": if (s && S.mapReady) { G.map.panTo({ lat: s.lat, lng: s.lng }); G.map.setZoom(16); } break;
    case "best": s.best = !s.best; await DB.put("spots", s); syncSpotMarkers(); renderTab(); break;
    case "bestonly": S.ui.bestOnly = !S.ui.bestOnly; savePrefs(); renderTab(); break;
    case "clearres": S.ui.results = null; renderTab(); break;
    case "addplace": { const p = S.ui.results[+a.dataset.i]; const ns = await addSpotAt(p.lat, p.lng, { name: p.name, place: { id: p.id, name: p.name, address: p.address, rating: p.rating, ratingCount: p.ratingCount, summary: p.summary, types: p.types, uri: p.uri, web: p.web, fetchedAt: p.fetchedAt } }); S.ui.results = null; break; }
    case "link": S.ui.linkResults = "loading"; renderTab(); try { S.ui.linkResults = await searchPlaces(s.name + " "); } catch (er) { S.ui.linkResults = { error: er.message || "Search failed." }; } renderTab(); break;
    case "pickplace": { const p = S.ui.linkResults[+a.dataset.i]; s.place = { id: p.id, name: p.name, address: p.address, rating: p.rating, ratingCount: p.ratingCount, summary: p.summary, types: p.types, uri: p.uri, web: p.web, fetchedAt: p.fetchedAt }; if (/^Unnamed spot$/.test(s.name)) s.name = p.name; await DB.put("spots", s); S.ui.linkResults = null; syncSpotMarkers(); renderTab(); break; }
    case "unlink": s.place = null; await DB.put("spots", s); renderTab(); break;
    case "refresh": try { a.textContent = "…"; await refreshPlace(s); renderTab(); } catch (er) { toast("Could not refresh: " + (er.message || "error")); renderTab(); } break;
    case "photo": openLightbox(id); break;
    case "delw": { if (!armed(a, "Sure?")) return; await DB.del("wifi", id); S.wifi = S.wifi.filter(w => w.id !== id); renderTab(); break; }
    case "delspot": if (armed(a, "Tap again to delete spot and its photos")) await removeSpot(s.id); break;
    case "type": { const t = a.dataset.t; S.f.off.has(t) ? S.f.off.delete(t) : S.f.off.add(t); savePrefs(); syncSpeedMarkers(); renderTab(); break; }
    case "showf": S.speed.filter(passFilter).forEach(r => S.hidden.delete(r.id)); saveHidden(); syncSpeedMarkers(); renderTab(); break;
    case "hidef": S.speed.filter(passFilter).forEach(r => S.hidden.add(r.id)); saveHidden(); syncSpeedMarkers(); renderTab(); break;
    case "onlyf": S.speed.forEach(r => passFilter(r) ? S.hidden.delete(r.id) : S.hidden.add(r.id)); saveHidden(); syncSpeedMarkers(); renderTab(); break;
    case "showall": S.hidden.clear(); saveHidden(); syncSpeedMarkers(); renderTab(); break;
    case "inview": case "hideview": { const b = G.map.getBounds(); if (!b) break; S.speed.filter(passFilter).forEach(r => { const inside = b.contains({ lat: r.lat, lng: r.lng }); if (act === "inview") { inside ? S.hidden.delete(r.id) : S.hidden.add(r.id); } else if (inside) S.hidden.add(r.id); }); saveHidden(); syncSpeedMarkers(); renderTab(); break; }
    case "speedrow": { const r = S.speed.find(x => x.id === id); if (r && S.mapReady) { G.map.panTo({ lat: r.lat, lng: r.lng }); G.map.setZoom(Math.max(G.map.getZoom(), 13)); if (isShown(r)) openSpeedInfo(r); } break; }
    case "clearspeed": if (armed(a, "Tap again to remove all")) { await DB.clear("speed"); S.speed = []; syncSpeedMarkers(); G.speedMk.forEach(m => m.map = null); G.speedMk.clear(); renderTab(); } break;
    case "changekey": showSetup(); break;
    case "impall": S.ui.importRows.forEach(r => { if (!r.dupe) r.pick = true; }); renderTab(); break;
    case "impnone": S.ui.importRows.forEach(r => r.pick = false); renderTab(); break;
    case "impcancel": S.ui.importRows = null; renderTab(); break;
    case "impgo": {
      const best = $("#imp-best").checked; const pick = S.ui.importRows.filter(r => r.pick);
      for (const r of pick) { const ns = { id: uid(), name: r.name, lat: r.lat, lng: r.lng, best, notes: "", place: null, created: Date.now() }; S.spots.push(ns); await DB.put("spots", ns); }
      S.ui.importRows = null; S.ui.tab = "spots"; syncSpotMarkers(); fitAll(); renderAll(); toast(`Imported ${pick.length} spot${pick.length === 1 ? "" : "s"}`); break;
    }
    case "export": {
      const blob = new Blob([JSON.stringify({ exported: new Date().toISOString(), spots: S.spots, wifi: S.wifi }, null, 2)], { type: "application/json" });
      const u = URL.createObjectURL(blob), l = document.createElement("a"); l.href = u; l.download = "van-spots-" + new Date().toISOString().slice(0, 10) + ".json"; l.click(); setTimeout(() => URL.revokeObjectURL(u), 2000); break;
    }
  }
});
body.addEventListener("change", async e => {
  const t = e.target, s = spotById(S.ui.spotId);
  if (t.dataset.field && s) { s[t.dataset.field] = t.value.trim() || (t.dataset.field === "name" ? "Unnamed spot" : ""); await DB.put("spots", s); if (t.dataset.field === "name") syncSpotMarkers(); return; }
  if (t.id === "sortsel") { S.ui.sort = t.value; savePrefs(); renderTab(); }
  if (t.id === "f-from") { S.f.from = t.value; savePrefs(); syncSpeedMarkers(); renderTab(); }
  if (t.id === "f-to") { S.f.to = t.value; savePrefs(); syncSpeedMarkers(); renderTab(); }
  if (t.id === "f-min") { S.f.minDown = +t.value; savePrefs(); syncSpeedMarkers(); renderTab(); }
  if (t.id === "f-q") { S.f.q = t.value; savePrefs(); syncSpeedMarkers(); renderTab(); }
  if (t.id === "photo-in" && s) { await addPhotos(s.id, [...t.files]); t.value = ""; }
  if (t.id === "saved-in" && t.files[0]) {
    try { const f = t.files[0]; S.ui.importRows = parseSaved(f.name, await f.text()); S.ui.busy = S.ui.importRows.length ? "" : "No places with coordinates were found in that file."; }
    catch (er) { S.ui.importRows = null; S.ui.busy = er.message || "Could not read that file."; }
    t.value = ""; renderTab();
  }
  if (t.id === "speed-in" && t.files[0]) {
    try {
      const { rows, noLoc } = parseSpeed(await t.files[0].text());
      const have = new Set(S.speed.map(r => r.id)); const fresh = rows.filter(r => !have.has(r.id));
      await DB.putMany("speed", fresh); S.speed = S.speed.concat(fresh); S.noLoc = noLoc; await DB.setKv("noLoc", noLoc);
      S.ui.busy2 = `Loaded ${rows.length} mapped results (${fresh.length} new)` + (noLoc ? `, ${noLoc} skipped without a location.` : "."); S.ui.tab = "speed";
      syncSpeedMarkers(); if (!S.spots.length) fitAll(); renderAll();
    } catch (er) { S.ui.busy2 = er.message || "Could not read that file."; renderTab(); }
    t.value = "";
  }
});
body.addEventListener("input", e => {
  if (e.target.id === "f-min") { const v = $("#mdv"); if (v) v.textContent = e.target.value; }
});
body.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "psearch") {
    const q = $("#pq").value.trim(); if (!q) return;
    S.ui.results = "loading"; renderTab();
    try { S.ui.results = await searchPlaces(q); } catch (er) { S.ui.results = { error: er.message || "Search failed." }; }
    renderTab(); const i = $("#pq"); if (i) i.value = q;
  }
  if (e.target.id === "wform") {
    const s = spotById(S.ui.spotId); if (!s) return;
    const w = { id: uid(), spotId: s.id, t: ($("#w-t").value || new Date().toISOString().slice(0, 16)), down: parseFloat($("#w-down").value), up: parseFloat($("#w-up").value), ping: $("#w-ping").value ? parseInt($("#w-ping").value, 10) : null, note: $("#w-note").value.trim(), src: "manual" };
    await DB.put("wifi", w); S.wifi.push(w); renderTab(); toast("Reading saved");
  }
});

/* ---------- boot ---------- */
(async function boot() {
  try {
    await DB.open();
    [S.spots, S.wifi, S.speed] = await Promise.all([DB.all("spots"), DB.all("wifi"), DB.all("speed")]);
    S.hidden = new Set(await DB.getKv("hidden", []));
    S.noLoc = await DB.getKv("noLoc", 0);
    const pr = await DB.getKv("prefs", null);
    if (pr) { S.f.off = new Set(pr.off || []); S.f.from = pr.from || ""; S.f.to = pr.to || ""; S.f.minDown = pr.minDown || 0; S.f.q = pr.q || ""; S.ui.bestOnly = !!pr.bestOnly; S.ui.sort = pr.sort || "best"; }
  } catch (e) {
    $("#body").innerHTML = '<p class="err">This browser blocked local storage, so spots and photos cannot be saved. Try a normal (non-private) window.</p>';
    return;
  }
  S.ui.tab = S.spots.length ? "spots" : (S.speed.length ? "speed" : "spots");
  renderAll(); initMap();
})();
</script>
</body>
</html>
